name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add -g agent-browser && agent-browser install --with-deps
      - run: bun run qa
      - name: Seeded bug must be caught
        run: "! bun run qa:bug"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: results/
